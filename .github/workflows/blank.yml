<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows Virtual</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    user-select: none;
}

body {
    overflow: hidden;
    background: #0078d7;
}

.desktop {
    width: 100vw;
    height: 100vh;
    position: relative;
    background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,.12), transparent 25%),
        linear-gradient(135deg, #0879c9, #064b91 60%, #031f4d);
}

/* ÍCONES */

.desktop-icons {
    position: absolute;
    top: 20px;
    left: 15px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.icon {
    width: 75px;
    text-align: center;
    color: white;
    font-size: 13px;
    cursor: pointer;
    padding: 7px;
    border-radius: 4px;
}

.icon:hover {
    background: rgba(255,255,255,.15);
}

.icon-image {
    font-size: 35px;
    margin-bottom: 5px;
}

/* BARRA DE TAREFAS */

.taskbar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 48px;
    background: rgba(20,20,20,.88);
    backdrop-filter: blur(15px);
    display: flex;
    align-items: center;
    z-index: 9999;
}

.start-button {
    width: 55px;
    height: 48px;
    border: none;
    background: transparent;
    color: white;
    font-size: 23px;
    cursor: pointer;
}

.start-button:hover {
    background: rgba(255,255,255,.12);
}

.task-apps {
    display: flex;
    gap: 3px;
    height: 100%;
}

.task-app {
    width: 48px;
    border: none;
    background: transparent;
    color: white;
    font-size: 21px;
    cursor: pointer;
}

.task-app:hover {
    background: rgba(255,255,255,.12);
}

.clock {
    margin-left: auto;
    color: white;
    padding: 0 15px;
    text-align: center;
    font-size: 12px;
}

/* MENU INICIAR */

.start-menu {
    position: absolute;
    bottom: 48px;
    left: 0;
    width: 390px;
    height: 520px;
    background: rgba(30,30,30,.96);
    backdrop-filter: blur(20px);
    color: white;
    display: none;
    z-index: 10000;
    padding: 25px;
    border-radius: 8px 8px 0 0;
}

.start-menu h2 {
    font-weight: 400;
    margin-bottom: 20px;
}

.search {
    width: 100%;
    padding: 12px;
    border: none;
    outline: none;
    background: #333;
    color: white;
    border-radius: 5px;
    margin-bottom: 20px;
}

.start-app {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 12px;
    border-radius: 5px;
    cursor: pointer;
}

.start-app:hover {
    background: rgba(255,255,255,.1);
}

.start-app span {
    font-size: 25px;
}

/* JANELAS */

.window {
    position: absolute;
    width: 650px;
    height: 430px;
    background: #f5f5f5;
    border-radius: 7px;
    box-shadow: 0 15px 45px rgba(0,0,0,.45);
    overflow: hidden;
    display: none;
    z-index: 100;
}

.titlebar {
    height: 38px;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    color: #222;
    cursor: move;
}

.title {
    padding-left: 15px;
    flex: 1;
}

.window-buttons {
    display: flex;
    height: 100%;
}

.window-buttons button {
    width: 45px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 15px;
}

.window-buttons button:hover {
    background: #ddd;
}

.window-buttons .close:hover {
    background: #e81123;
    color: white;
}

.content {
    height: calc(100% - 38px);
    overflow: auto;
}

/* BLOCO DE NOTAS */

.notepad {
    width: 100%;
    height: 100%;
    border: none;
    resize: none;
    outline: none;
    padding: 15px;
    font-size: 16px;
}

/* NAVEGADOR */

.browser-toolbar {
    padding: 10px;
    background: #ddd;
    display: flex;
    gap: 8px;
}

.browser-toolbar input {
    flex: 1;
    padding: 8px;
    border: 1px solid #aaa;
    border-radius: 5px;
}

.browser-toolbar button {
    padding: 8px 14px;
    border: none;
    background: #0078d7;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

.browser-page {
    height: calc(100% - 60px);
    background: white;
    padding: 30px;
    color: #222;
}

/* CALCULADORA */

.calculator {
    width: 100%;
    height: 100%;
    background: #202020;
    padding: 20px;
}

.calc-display {
    width: 100%;
    height: 70px;
    background: #111;
    color: white;
    border: none;
    text-align: right;
    padding: 10px;
    font-size: 30px;
    margin-bottom: 10px;
}

.calc-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.calc-buttons button {
    height: 55px;
    border: none;
    background: #333;
    color: white;
    font-size: 18px;
    border-radius: 5px;
    cursor: pointer;
}

.calc-buttons button:hover {
    background: #555;
}

.calc-buttons .equal {
    background: #0078d7;
}

/* EXPLORADOR */

.explorer {
    padding: 20px;
}

.folder {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    width: 100px;
    padding: 15px;
    cursor: pointer;
}

.folder:hover {
    background: #ddd;
}

.folder-icon {
    font-size: 45px;
}

/* RESPONSIVO */

@media(max-width: 700px) {
    .window {
        width: 95vw;
        height: 70vh;
        left: 2.5vw !important;
        top: 10vh !important;
    }

    .start-menu {
        width: 95vw;
    }
}
</style>
</head>

<body>

<div class="desktop">

    <!-- ÍCONES -->
    <div class="desktop-icons">

        <div class="icon" ondblclick="openWindow('explorer')">
            <div class="icon-image">📁</div>
            Explorador
        </div>

        <div class="icon" ondblclick="openWindow('notepad')">
            <div class="icon-image">📝</div>
            Bloco de Notas
        </div>

        <div class="icon" ondblclick="openWindow('calculator')">
            <div class="icon-image">🧮</div>
            Calculadora
        </div>

        <div class="icon" ondblclick="openWindow('browser')">
            <div class="icon-image">🌐</div>
            Navegador
        </div>

    </div>


    <!-- EXPLORADOR -->
    <div class="window" id="explorer" style="left: 180px; top: 80px;">

        <div class="titlebar">
            <div class="title">📁 Explorador de Arquivos</div>

            <div class="window-buttons">
                <button onclick="minimizeWindow('explorer')">—</button>
                <button onclick="maximizeWindow('explorer')">□</button>
                <button class="close" onclick="closeWindow('explorer')">✕</button>
            </div>
        </div>

        <div class="content explorer">

            <h2>Este Computador</h2>
            <br>

            <div class="folder">
                <div class="folder-icon">📁</div>
                Documentos
            </div>

            <div class="folder">
                <div class="folder-icon">📁</div>
                Downloads
            </div>

            <div class="folder">
                <div class="folder-icon">📁</div>
                Imagens
            </div>

            <div class="folder">
                <div class="folder-icon">📁</div>
                Música
            </div>

            <div class="folder">
                <div class="folder-icon">💾</div>
                Disco Local
            </div>

        </div>
    </div>


    <!-- BLOCO DE NOTAS -->
    <div class="window" id="notepad" style="left: 250px; top: 120px;">

        <div class="titlebar">
            <div class="title">📝 Bloco de Notas</div>

            <div class="window-buttons">
                <button onclick="minimizeWindow('notepad')">—</button>
                <button onclick="maximizeWindow('notepad')">□</button>
                <button class="close" onclick="closeWindow('notepad')">✕</button>
            </div>
        </div>

        <div class="content">
            <textarea class="notepad" placeholder="Digite aqui..."></textarea>
        </div>

    </div>


    <!-- CALCULADORA -->
    <div class="window" id="calculator" style="left: 350px; top: 100px; width: 350px; height: 480px;">

        <div class="titlebar">
            <div class="title">🧮 Calculadora</div>

            <div class="window-buttons">
                <button onclick="minimizeWindow('calculator')">—</button>
                <button onclick="maximizeWindow('calculator')">□</button>
                <button class="close" onclick="closeWindow('calculator')">✕</button>
            </div>
        </div>

        <div class="content">

            <div class="calculator">

                <input id="calcDisplay"
                       class="calc-display"
                       readonly>

                <div class="calc-buttons">

                    <button onclick="clearCalc()">C</button>
                    <button onclick="addCalc('(')">(</button>
                    <button onclick="addCalc(')')">)</button>
                    <button onclick="addCalc('/')">÷</button>

                    <button onclick="addCalc('7')">7</button>
                    <button onclick="addCalc('8')">8</button>
                    <button onclick="addCalc('9')">9</button>
                    <button onclick="addCalc('*')">×</button>

                    <button onclick="addCalc('4')">4</button>
                    <button onclick="addCalc('5')">5</button>
                    <button onclick="addCalc('6')">6</button>
                    <button onclick="addCalc('-')">−</button>

                    <button onclick="addCalc('1')">1</button>
                    <button onclick="addCalc('2')">2</button>
                    <button onclick="addCalc('3')">3</button>
                    <button onclick="addCalc('+')">+</button>

                    <button onclick="addCalc('0')">0</button>
                    <button onclick="addCalc('.')">.</button>
                    <button class="equal" onclick="calculate()">=</button>

                </div>

            </div>

        </div>

    </div>


    <!-- NAVEGADOR -->
    <div class="window" id="browser" style="left: 150px; top: 70px;">

        <div class="titlebar">

            <div class="title">🌐 Navegador</div>

            <div class="window-buttons">
                <button onclick="minimizeWindow('browser')">—</button>
                <button onclick="maximizeWindow('browser')">□</button>
                <button class="close" onclick="closeWindow('browser')">✕</button>
            </div>

        </div>

        <div class="content">

            <div class="browser-toolbar">

                <input id="urlInput"
                       placeholder="Digite um endereço...">

                <button onclick="goBrowser()">Ir</button>

            </div>

            <div class="browser-page" id="browserPage">

                <h1>🌐 Navegador Virtual</h1>

                <br>

                <p>Digite um endereço acima.</p>

                <br>

                <p>
                    Este navegador é uma demonstração do PC virtual.
                </p>

            </div>

        </div>

    </div>


    <!-- MENU INICIAR -->

    <div class="start-menu" id="startMenu">

        <h2>Iniciar</h2>

        <input class="search"
               placeholder="Pesquisar aplicativos">

        <div class="start-app"
             onclick="openWindow('explorer')">
            <span>📁</span>
            Explorador de Arquivos
        </div>

        <div class="start-app"
             onclick="openWindow('notepad')">
            <span>📝</span>
            Bloco de Notas
        </div>

        <div class="start-app"
             onclick="openWindow('calculator')">
            <span>🧮</span>
            Calculadora
        </div>

        <div class="start-app"
             onclick="openWindow('browser')">
            <span>🌐</span>
            Navegador
        </div>

    </div>


    <!-- BARRA DE TAREFAS -->

    <div class="taskbar">

        <button class="start-button"
                onclick="toggleStart()">
            ⊞
        </button>

        <div class="task-apps">

            <button class="task-app"
                    onclick="openWindow('explorer')">
                📁
            </button>

            <button class="task-app"
                    onclick="openWindow('browser')">
                🌐
            </button>

            <button class="task-app"
                    onclick="openWindow('notepad')">
                📝
            </button>

        </div>

        <div class="clock" id="clock"></div>

    </div>

</div>


<script>

let zIndex = 100;


/* MENU INICIAR */

function toggleStart() {

    const menu = document.getElementById("startMenu");

    if (menu.style.display === "block") {
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }

}


/* ABRIR JANELA */

function openWindow(id) {

    const win = document.getElementById(id);

    win.style.display = "block";

    zIndex++;

    win.style.zIndex = zIndex;

    document.getElementById("startMenu").style.display = "none";
}


/* FECHAR */

function closeWindow(id) {

    document.getElementById(id).style.display = "none";

}


/* MINIMIZAR */

function minimizeWindow(id) {

    document.getElementById(id).style.display = "none";

}


/* MAXIMIZAR */

function maximizeWindow(id) {

    const win = document.getElementById(id);

    if (win.dataset.maximized === "true") {

        win.style.width = "650px";
        win.style.height = "430px";
        win.style.left = "200px";
        win.style.top = "80px";

        win.dataset.maximized = "false";

    } else {

        win.style.left = "0";
        win.style.top = "0";
        win.style.width = "100vw";
        win.style.height = "calc(100vh - 48px)";

        win.dataset.maximized = "true";
    }

}


/* RELÓGIO */

function updateClock() {

    const now = new Date();

    const time = now.toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit"
    });

    const date = now.toLocaleDateString("pt-BR");

    document.getElementById("clock").innerHTML =
        time + "<br>" + date;

}

setInterval(updateClock, 1000);

updateClock();


/* CALCULADORA */

function addCalc(value) {

    document.getElementById("calcDisplay").value += value;

}

function clearCalc() {

    document.getElementById("calcDisplay").value = "";

}

function calculate() {

    const display = document.getElementById("calcDisplay");

    try {

        display.value = Function(
            '"use strict"; return (' +
            display.value +
            ')'
        )();

    } catch {

        display.value = "Erro";

    }

}


/* NAVEGADOR */

function goBrowser() {

    const input = document.getElementById("urlInput");

    let url = input.value.trim();

    if (!url) return;

    if (!url.startsWith("http://") &&
        !url.startsWith("https://")) {

        url = "https://" + url;

    }

    document.getElementById("browserPage").innerHTML =

        "<h2>🌐 Abrindo...</h2>" +
        "<p>" + url + "</p>" +
        "<br>" +
        "<p>Por segurança, este navegador de demonstração não incorpora sites externos.</p>";

}


/* TRAZER JANELA PARA FRENTE */

document.querySelectorAll(".window").forEach(win => {

    win.addEventListener("mousedown", () => {

        zIndex++;

        win.style.zIndex = zIndex;

    });

});


/* JANELAS ARRASTÁVEIS */

document.querySelectorAll(".titlebar").forEach(bar => {

    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    bar.addEventListener("mousedown", e => {

        const win = bar.parentElement;

        if (win.dataset.maximized === "true") return;

        dragging = true;

        offsetX = e.clientX - win.offsetLeft;
        offsetY = e.clientY - win.offsetTop;

    });

    document.addEventListener("mousemove", e => {

        if (!dragging) return;

        const win = bar.parentElement;

        win.style.left =
            (e.clientX - offsetX) + "px";

        win.style.top =
            (e.clientY - offsetY) + "px";

    });

    document.addEventListener("mouseup", () => {

        dragging = false;

    });

});

</script>

</body>
</html>
